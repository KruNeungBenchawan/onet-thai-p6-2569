            font-weight: 700;
            color: #065f46;

                height: auto;

        let currentSlide = 0;

        function renderSlides() {
            const container = document.getElementById('slideContainer');
            const selector = document.getElementById('slideSelector');
            container.innerHTML = '';
            selector.innerHTML = '';

            slidesData.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = s.menuTitle;
                selector.appendChild(opt);

                const slideEl = document.createElement('div');
                slideEl.className = 'slide' + (idx === 0 ? ' active' : '');
                slideEl.id = 'slide_' + idx;

                if (s.type === 'cover') {
                    slideEl.innerHTML = s.html;
                } else {
                    slideEl.innerHTML = `
                        <div class="slide-header">
                            <div class="slide-title">${s.title}</div>
                            <div class="strand-tag">${s.strand}</div>
                        </div>
                        <div class="slide-body">
                            ${s.html}
                        </div>
                        <div style="text-align:center; padding-top:12px; margin-top:auto;">
                            <div style="background:#ffffff; border:3px solid #f472b6; border-radius:20px; padding:8px 24px; display:inline-block; box-shadow:0 5px 0 #fbcfe8; color:#be185d; font-weight:700; font-size:1.05rem;">
                                👩‍🏫 ผู้ออกแบบและพัฒนาสื่อการสอน : <strong>ครูเบ็ญจวรรณ สิงห์กุล</strong> | โรงเรียนวัดราษฎร์บำรุง สพป.สระบุรี เขต 2
                            </div>
                        </div>
                    `;
                }
                container.appendChild(slideEl);
            });
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.slide').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentSlide);
            });
            document.getElementById('slideSelector').value = currentSlide;
            document.getElementById('slideCounter').textContent = `${currentSlide + 1} / ${slidesData.length}`;
            const revealBtn = document.getElementById('globalRevealBtn');
            if (slidesData[currentSlide].isQuiz) {
                revealBtn.style.display = 'inline-block';
            } else {
                revealBtn.style.display = 'none';
            }
        }

        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                updateUI();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateUI();
            }
        }

        function goToSlide(idx) {
            currentSlide = parseInt(idx, 10);
            updateUI();
        }

        function selectChoice(qIdx, cIdx, correctIdx) {
            const clickedEl = document.getElementById(`q${qIdx}_c${cIdx}`);
            const correctEl = document.getElementById(`q${qIdx}_c${correctIdx}`);
            const panel = document.getElementById(`ans_panel_${qIdx}`);

            if (cIdx === correctIdx) {
                clickedEl.classList.add('correct-revealed');
                clickedEl.querySelector('.choice-status').textContent = '✅ ถูกต้อง!';
            } else {
                clickedEl.classList.add('wrong-selected');
                clickedEl.querySelector('.choice-status').textContent = '❌ ยังไม่ถูก';
                correctEl.classList.add('correct-revealed');
                correctEl.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
            }
            panel.classList.add('visible');
        }

        function toggleCurrentAnswer() {
            const s = slidesData[currentSlide];
            if (!s.isQuiz) return;
            const qIdx = s.quizIndex;
            const panel = document.getElementById(`ans_panel_${qIdx}`);
            const isShowing = panel.classList.toggle('visible');

            if (typeof s.correctIndex === 'number') {
                const correctEl = document.getElementById(`q${qIdx}_c${s.correctIndex}`);
                if (isShowing) {
                    correctEl.classList.add('correct-revealed');
                    correctEl.querySelector('.choice-status').textContent = '✅ คำตอบที่ถูก';
                } else {
                    correctEl.classList.remove('correct-revealed');
                    correctEl.querySelector('.choice-status').textContent = '';
                }
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            } else if (e.key === ' ') {
                e.preventDefault();
                toggleCurrentAnswer();
            }
        });

        renderSlides();
    </script>
